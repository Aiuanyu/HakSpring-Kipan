<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <!-- 方案三 (V3)：大導角超橢圓立體鍵帽 (Super-Squircle Keycap on Lavender Rim)
       108x108 dp 畫布，72 dp 可見區 (r=36 dp)，66 dp 安全圓 (r=33 dp)。
       保留「方圓鍵帽」造型與淡吊菜老鼠色底板，但透過大導角 (rx=23.5) 讓對角線完美貼合 33 dp 安全圓，
       使鍵帽寬度從原本 39 dp (54%) / 蒂兒 A 版 51 dp (70%) 大幅撐滿至 61 dp (佔可見範圍 85%！) -->
  <defs>
    <linearGradient id="v3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eae3f1"/>
      <stop offset="60%" stop-color="#e3daec"/>
      <stop offset="100%" stop-color="#dcd2e7"/>
    </linearGradient>
    <linearGradient id="v3_key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245d48"/>
      <stop offset="100%" stop-color="#162e24"/>
    </linearGradient>
    <linearGradient id="v3_h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafbd0"/>
      <stop offset="40%" stop-color="#d2dfd0"/>
      <stop offset="100%" stop-color="#aa96b7"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Layer (Lavender Plate) -->
  <rect width="108" height="108" fill="url(#v3_bg)"/>

  <!-- 2. Foreground Layer: Super-Squircle 3D Keycap (width=61 dp, max corner radius=32.7 dp <= 33.0 dp) -->
  <!-- Keycap drop shadow: x=23.5..84.5 (w=61), y=25.5..84.5 (h=59), rx=24 -->
  <rect x="23.5" y="25.5" width="61" height="59" rx="24" fill="#0d1b15" opacity="0.88"/>
  <!-- Keycap 3D bevel body: x=23.5..84.5 (w=61), y=23.5..81.5 (h=58), rx=23.5 -->
  <rect x="23.5" y="23.5" width="61" height="58" rx="23.5" fill="#1b4636" stroke="#245d48" stroke-width="1.2"/>
  <!-- Keycap top dish: x=25.8..82.2 (w=56.4), y=22.5..76.5 (h=54), rx=21 -->
  <rect x="25.8" y="22.5" width="56.4" height="54" rx="21" fill="url(#v3_key)" stroke="#678c3f" stroke-width="1.4"/>

  <!-- Tactile Homing Bar -->
  <path d="M 38 71.2 L 70 71.2" stroke="#aa96b7" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- H/h Cursor & Spring Arch -->
  <path d="M 39.5 34.0 L 39.5 64.0" stroke="#eafbd0" stroke-width="4.0" stroke-linecap="round"/>
  <path d="M 39.5 49.0 C 44.5 39.8, 62.5 39.8, 65.5 49.0 L 65.5 64.0" stroke="url(#v3_h)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M 39.5 52.0 L 65.5 52.0" stroke="#aa96b7" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>

  <!-- Sprouting Leaves & Dewdrops -->
  <path d="M 65.5 45.5 C 68.0 35.5, 75.5 27.5, 80.5 27.8 C 79.0 36.0, 72.5 41.0, 65.5 45.5 Z" fill="#eafbd0"/>
  <path d="M 66.8 43.2 C 60.5 37.0, 63.0 26.5, 69.2 24.2 C 70.5 31.5, 68.8 38.5, 66.8 43.2 Z" fill="#678c3f"/>
  <circle cx="75.2" cy="24.5" r="1.9" fill="#eafbd0"/>
  <circle cx="81.2" cy="33.0" r="1.4" fill="#aa96b7"/>
</svg>
